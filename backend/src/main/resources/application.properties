spring.application.name=habitfit-backend

# ── Server ───────────────────────────────────────────────────────────────────
# 8080/8090 is taken by another Docker project on this machine, so local runs use 8091.
server.port=${SERVER_PORT:8091}

# ── MySQL (Docker Compose defaults; override with env vars) ─────────────────
# characterEncoding=UTF-8 makes Connector/J negotiate utf8mb4, so emoji icons survive.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:habitfit}?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:habitfit}
spring.datasource.password=${MYSQL_PASSWORD:habitfit}

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──────────────────────────────────────────────────────────────────────
# HS256 needs >= 32 bytes. Override via env var in production.
jwt.secret=${JWT_SECRET:habitfit-demo-secret-key-change-me-0123456789abcdef}
jwt.expiration-ms=864000000

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
